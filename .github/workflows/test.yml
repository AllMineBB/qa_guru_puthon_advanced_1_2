on:
  pull_request:
    branches:
      - main


jobs:
  tests:
    mane: Test app
    runs-on: ubuntu-lastest
    step:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: pip install --upgrade -r requirements.txt
      - run: docker compose up -d --build
      - run: pytest tests -v

      - run: docker compose logs app
        if: always()