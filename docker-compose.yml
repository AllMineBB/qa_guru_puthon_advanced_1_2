services:
  db:
    image: postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - 5432:5432

  app:
    build: .
    image: qa-guru-app
    restart: always
    ports:
      - 8002:80
    environment:
      DATABASE_ENGINE: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/postgres
      DATABASE_POOL_SIZE: 10
    depends_on:
      - db

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  db-data: